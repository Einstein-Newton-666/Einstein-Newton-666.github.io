# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Einstein-Newton-666 的博客
subtitle: 日志与笔记
description: 记录技术学习、生活片段与沿途灵感的个人博客。
keywords: [技术笔记, 生活日志, Hexo]
author: Einstein-Newton-666
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://einstein-newton-666.github.io/
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
# sources.json 是资源来源记录（数据文件，不是页面），这里跳过渲染让它按原样拷贝，
# 同时避免被 hexo-generator-sitemap 当成页面收录进 sitemap.xml。
skip_render:
  - images/brand/sources.json

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 注意：Actions 里 checkout 出来的文件 mtime 等于签出时刻，用 'mtime' 会让每篇文章的
## “更新于”变成当次部署时间，订阅源的 <updated> 也会跟着跳。'date' 只认 front-matter
## 里的 updated，需要展示更新时间时在文章头部写 updated: YYYY-MM-DD HH:mm:ss。
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: redefine

# Local search (for Redefine navbar search, requires hexo-generator-searchdb)
search:
  path: search.xml
  field: post
  content: true
  format: html

# Math rendering (hexo-filter-mathjax, see Redefine docs)
mathjax: true

# Atom 订阅
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  autodiscovery: true

# 站点地图（hexo-generator-sitemap）
# 生成 public/sitemap.xml，供搜索引擎抓取；文章条目的 lastmod 取自文章的 updated/date。
# 单篇页面如需排除，在该页 front-matter 写 sitemap: false（404 页就是这么处理的）。
# template 指向自定义模板：首页/标签/分类条目不写 lastmod，避免每次部署都刷新这个时间。
sitemap:
  path: sitemap.xml
  template: ./sitemap_template.xml
  rel: false
  tags: true
  categories: true
