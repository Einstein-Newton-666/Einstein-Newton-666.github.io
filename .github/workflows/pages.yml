name: Deploy Hexo site to GitHub Pages

# PR 校验在 ci.yml（只读权限）。这里只负责发布，不要再把 pull_request 加回来：
# 本流程持有 pages: write 与 id-token: write，PR 运行会一并继承这些权限。
on:
  push:
    branches: [main]
    # 只改仓库文档/依赖机器人配置时不必重新发布站点。
    # 注意不要写成 '**.md'：source/_posts 与 source/**/*.md 都是站点内容，
    # 只改文章时必须照常触发发布。
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 按 ref 分组：同一分支同一时间只跑一个发布，手动触发的其他分支也不会互相取消。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 已于 2026-04 结束维护；本地开发用的是 24，这里是当前 Active LTS。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test = 单元测试 + hexo generate + test/verify-site.mjs 产物校验
      - name: Test and build site
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
