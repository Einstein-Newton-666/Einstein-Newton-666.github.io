name: Deploy Hexo site to GitHub Pages

# PR 校验在 ci.yml（只读权限）。这里只负责发布，不要再把 pull_request 加回来：
# 本流程持有 pages: write 与 id-token: write，PR 运行会一并继承这些权限。
on:
  push:
    branches: [main]
    # 只改仓库文档/依赖机器人配置时不必重新发布站点。
    # 注意不要写成 '**.md'：source/_posts 与 source/**/*.md 都是站点内容，
    # 只改文章时必须照常触发发布。
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 按 ref 分组：同一分支同一时间只跑一个发布，手动触发的其他分支也不会互相取消。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 20 已于 2026-04 结束维护；本地开发用的是 24，这里是当前 Active LTS。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test = 单元测试 + hexo generate + test/verify-site.mjs 产物校验
      # TZ 必须跟本地一致：Hexo 按“构建进程所在时区”渲染永久链接，跑在 UTC 的
      # runner 上会把凌晨 0–8 点写的文章排到前一天。
      - name: Test and build site
        run: npm test
        env:
          TZ: Asia/Shanghai

      # 缺 Secret 就直接失败：宁可这次不发，也不能把不设防的站点传上 Pages。
      - name: Check gate password
        run: |
          if [ -z "$BLOG_GATE_PASSWORD" ]; then
            echo "::error::缺少 BLOG_GATE_PASSWORD secret，拒绝发布未加密站点"
            exit 1
          fi
        env:
          BLOG_GATE_PASSWORD: ${{ secrets.BLOG_GATE_PASSWORD }}

      # 重新生成并加密，随后校验密文产物（解不回原文/漏明文都会失败）
      # BLOG_GATE_SCOPE=posts：只锁 front-matter 写了 private: true 的文章
      # （整站模式写 site；范围是显式开关，漏打标记不会静默改变范围）
      - name: Build gated site
        run: npm run gate:build
        env:
          TZ: Asia/Shanghai
          BLOG_GATE_SCOPE: posts
          BLOG_GATE_PASSWORD: ${{ secrets.BLOG_GATE_PASSWORD }}

      - name: Verify gated artifact
        run: npm run gate:verify
        env:
          BLOG_GATE_PASSWORD: ${{ secrets.BLOG_GATE_PASSWORD }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
