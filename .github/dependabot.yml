version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    # minor / patch 合成一个 PR，major 仍然单独开，便于逐个验证。
    npm-minor-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    # 之前只配了 npm，Actions 永远不会被自动升级，这里补上。
    # 只合并 minor/patch：Actions 的大版本通常伴随 runner/Node 运行时变更，
    # 需要逐个合并、逐个确认真实部署，不放进同一个 PR。
    github-actions-minor-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
