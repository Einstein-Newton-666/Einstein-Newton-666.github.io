# Redefine 主题配置覆盖（Hexo 自动与主题自带配置合并）
# 主题默认配置见 node_modules/hexo-theme-redefine/_config.yml
# 官方文档: https://redefine-docs.ohevan.com/

# >>>>>>>>>> 基本信息
info:
  title: Einstein-Newton-666 的博客
  subtitle: 日志与笔记
  author: Einstein-Newton-666
  url: https://einstein-newton-666.github.io/

# >>>>>>>>>> 图片与主色
defaults:
  avatar: /images/brand/castorice-avatar-display.webp
  favicon: /images/brand/favicon-avatar.png

colors:
  primary: "#3b8588"
  default_mode: light

global:
  content_max_width: 1080px
  sidebar_width: 232px
  website_counter:
    enable: false
  open_graph:
    enable: true
    image: /images/brand/hero-day.webp
    description: 记录技术学习、生活片段与沿途灵感的个人博客。

# >>>>>>>>>> 首页横幅
home_banner:
  enable: true
  style: fixed
  image:
    light: /images/brand/hero-day.webp
    dark: /images/brand/hero-day.webp
  title: Einstein-Newton-666 的博客
  subtitle:
    text:
      - 记录学习与生活，也收藏沿途的风景
    loop: false

# >>>>>>>>>> 导航栏
navbar:
  links:
    Home:
      path: none
    首页:
      path: /
      icon: fa-regular fa-house
    分类:
      path: /categories
      icon: fa-regular fa-folder
    标签:
      path: /tags
      icon: fa-regular fa-tags
    日志:
      path: /logs
      icon: fa-regular fa-book-open
    归档:
      path: /archives
      icon: fa-regular fa-archive
    关于:
      path: /about
      icon: fa-regular fa-user
    RSS:
      path: /atom.xml
      icon: fa-solid fa-rss
  search:
    enable: true
    preload: false

# >>>>>>>>>> 首页与文章
home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement: 在代码、书页和晚风之间，记录值得留下的片段。
    show_on_mobile: true
    links:
      归档:
        path: /archives
        icon: fa-regular fa-archive
      分类:
        path: /categories
        icon: fa-regular fa-folder
      标签:
        path: /tags
        icon: fa-regular fa-tags
      日志:
        path: /logs
        icon: fa-regular fa-book-open
  excerpt_length: 120

articles:
  word_count:
    enable: true
    count: true
    min2read: true
  recommendation:
    enable: false

# 尚未配置可用服务前关闭评论，避免加载主题示例地址。
comment:
  enable: false

# >>>>>>>>>> 页脚
footer:
  runtime: true
  start: 2024/08/21 00:00:00
  statistics: true
  icon: '<i class="fa-regular fa-star" aria-hidden="true"></i>'
  customize: 在代码、书页和晚风之间持续记录

# >>>>>>>>>> 自定义样式与行为
inject:
  enable: true
  head:
    # 首页横幅的分时预加载不在这里：inject.head 是全局注入，而内页没有横幅，
    # 那样每个内页都会白下载一张 213–925KB 的横幅图，还会和页面真正要用的背景图抢带宽。
    # 改由 scripts/hero-preload.js 用 after_render:html 过滤器只注入到含首页横幅的页面。
    # 192×192 图标（已量化到 256 色，16KB）由 defaults.favicon 提供给 rel=icon /
    # apple-touch-icon / shortcut icon 三个标签，主题只支持单一图标文件，无需额外补 32×32。
    - '<link rel="stylesheet" href="/css/anime-theme.css">'
  footer:
    - '<script src="/js/anime-home-scenes.js"></script>'
    - '<script src="/js/anime-page-scenes.js"></script>'
    - '<script src="/js/anime-theme.js"></script>'
    - '<script src="/js/anime-image-viewer.js"></script>'

plugins:
  feed:
    enable: true

page_templates:
  tags_style: cloud

# 使用 Redefine 官方支持的版本化 CDN 分发主题静态资源。
cdn:
  enable: true
  provider: npmmirror
